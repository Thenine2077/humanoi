# controller_manager ของ "แขน" บนหุ่นรวม (humanoi_full.urdf.xacro)
# โหลดโดยปลั๊กอิน gz_ros2_control ในโมเดล ไม่ใช่รันเป็นโหนดแยก
#
# ทำไมไม่ reuse ar_hardware_interface/config/controllers.yaml ของผู้ขายตรงๆ:
# ไฟล์นั้นใช้ได้อยู่ตอนแขนเป็นหุ่นเดี่ยว แต่พอมารวมกับฐาน เราอยากคุม update_rate แยก
# และอยากให้ชัดว่า controller ชุดนี้คุมเฉพาะ 6 ข้อต่อแขน ไม่ยุ่งกับล้อ
# (ล้อยังขับด้วยปลั๊กอิน VelocityControl ของ gz อยู่ ยังไม่ได้อยู่ใต้ ros2_control)
controller_manager:
  ros__parameters:
    update_rate: 100 # Hz — อยู่ในซิมล้วน ไม่มีคอขวด serial เหมือนฝั่งแขนจริง

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.0
      joint_1: { trajectory: 0.2, goal: 0.02 }
      joint_2: { trajectory: 0.2, goal: 0.02 }
      joint_3: { trajectory: 0.2, goal: 0.02 }
      joint_4: { trajectory: 0.2, goal: 0.02 }
      joint_5: { trajectory: 0.2, goal: 0.02 }
      joint_6: { trajectory: 0.2, goal: 0.02 }

joint_state_broadcaster:
  ros__parameters:
    # ระบุเฉพาะข้อต่อแขน: ล้อถูกเผยแพร่โดยปลั๊กอิน JointStatePublisher ของ gz อยู่แล้ว
    # (ดู mecanum_base.urdf.xacro) ถ้าปล่อยว่างทั้งสองฝั่งจะยิง /joint_states ทับกัน
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    interfaces:
      - position
