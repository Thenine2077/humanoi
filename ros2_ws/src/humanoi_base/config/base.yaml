# relay_bridge ของฐานจริง (Mega + relay 8 ตัว + encoder 4 ล้อ) — arm base / arm remote โหลดไฟล์นี้
# encoder_map / encoder_signs: หาค่าด้วย arm wheel-check (บันทึกลงไฟล์นี้ให้เอง) แล้วปิด/เปิด arm base ใหม่
relay_bridge:
  ros__parameters:
    protocol: mecanum4
    wheel_radius: 0.0725       # m — ล้อ Ø14.5 cm (วัด 28 ต.ค.)
    track: 0.385               # m — กลางล้อซ้าย-ขวา: กว้างนอกล้อ 42.5 − ล้อหนา 4
    wheelbase: 0.385           # m — เพลาหน้า-หลัง: ยาวรวม 53 − ล้อ Ø14.5
    counts_per_rev: 720.0      # ค่านับต่อรอบล้อ: เฟิร์มแวร์ enc=a2 (สาย A อย่างเดียว) = 720 · enc=x4 (ต่อสาย B ด้วย) = 1440
                               #   x อัตราทด encoder:ล้อ (encoder ต่อแกนล้อตรง = 1)
    encoder_map: [3, 1, 2, 0]  # ล้อ FL FR RL RR ใช้ E1-E4 ตัวไหน (0 = E1)
    encoder_signs: [1, 1, 1, 1]  # 1 / -1 ให้ล้อเดินหน้านับเป็นบวก
    publish_odom_tf: false     # TF odom->base_footprint จากล้อ — rf2o (real_slam) ส่งอยู่แล้ว อย่าเปิดคู่กัน
    guard:                     # กันชน lidar ชั้น Mega: ทิศที่มีของขวาง Mega ไม่ขับ (ทั้งรีโมทและ ROS) — humanoi_base/guard.py
      enabled: true            # false = ไม่กัน (arm base noguard ปิดให้ชั่วคราว) · เปิดอยู่แต่ไม่มี lidar = ล้อไม่หมุนทุกทิศ
      stop_dist: 0.30          # m ของในทางใกล้กว่านี้จากขอบตัวหุ่น = ห้ามไปทางนั้น (arm drive หยุดรอเองที่ 0.35 ก่อน)
      rot_margin: 0.05         # m ห้ามหมุนเมื่อของห่างวงกวาดมุมตัวหุ่นไม่ถึงเท่านี้
      footprint: [0.265, 0.265, 0.2125, 0.2125]  # m กลางฐานถึงขอบ หน้า หลัง ซ้าย ขวา — แขนพับแล้วยื่นเลยฐาน ให้ขยายตรงนี้
