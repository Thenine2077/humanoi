# ตำแหน่ง lidar บนฐานจริง (เฟรม base_footprint: x ไปหน้า, y ไปซ้าย, yaw หมุนทวนเข็ม = บวก)
# ที่เดียวที่เก็บค่านี้ — lidar.launch.py (static TF + scan_mask), กันชน lidar, arm drive อ่านจากไฟล์นี้
# แก้แล้วปิด/เปิด arm lidar ใหม่
x: 0.175      # m กลางฐานถึงกลาง lidar — ตลับเมตร 29 ต.ค.: กลาง lidar ถึงขอบแผ่นฐานหน้า 2.5 หลัง 37.5 cm
y: 0.0        # m ซ้าย 15.5 ขวา 15 cm = เยื้องขวา 2.5 mm (ไม่ใส่)
z: 0.235      # m สูงจากพื้น (วัด 29 ต.ค.)
yaw_deg: 0.0  # องศา lidar หันเบี้ยวจากหน้าฐาน — arm lidar-check วัดและบันทึกให้
